<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAS2 · add a friend</title>
<link rel="stylesheet" href="gas2.css">
<style>
.box { background: var(--card); border-radius: 16px; padding: 18px; margin: 14px 0; }
.key { font: 13px ui-monospace, Menlo, Consolas, monospace; word-break: break-all; background: #f2f2f7; padding: 10px; border-radius: 10px; }
.btn { display: inline-block; font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 99px; border: 0; background: #7b4dff; color: #fff; cursor: pointer; text-decoration: none; margin: 6px 6px 0 0; }
.btn.alt { background: #ececf0; color: #1d1d1f; }
</style>
</head>
<body>
<header class="top"></header>
<main class="prose">
  <h1>A friend on GAS2</h1>
  <p>Someone showed you their GAS2 code. To be friends, add their key in your GAS2.</p>
  <div class="box">
    <div class="key" id="k"></div>
    <p>
      <button class="btn alt" onclick="navigator.clipboard.writeText(K).then(() => this.textContent = 'Copied ✓')">Copy the key</button>
      <a class="btn" id="web" href="#">Add them on GAS2 on the web</a>
    </p>
    <p class="small muted">In the GAS2 app: Friends, Add a friend, paste the key. They are asked, and once they say yes you are friends.</p>
  </div>
  <p class="small muted">No GAS2 yet? <a href="get.html">Get the app</a>, or use it <a href="../gas2web/">on the web</a>.</p>
</main>
<script>
const K = (new URLSearchParams(location.search).get('k') || '').toLowerCase();
const ok = /^[0-9a-f]{64}$/.test(K);
document.getElementById('k').textContent = ok ? K : 'This link carries no key.';
document.getElementById('web').href = ok ? '../gas2web/?friend=' + K : '../gas2web/';
</script>
<script src="gas2.js"></script>
<script>nav('');</script>
</body>
</html>
