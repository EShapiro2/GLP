name: gas_phone
description: "GAS2 on a device: the person's Grassroots Super-App and its mini-apps, over the relay"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # The GLP runtime, the person's super-app.
  glp_runtime:
    path: ../../../glp_runtime
  # GAS2's device: the super-app's host, its page server, the relay.
  gas2_device:
    path: ../device
  # GNA's networking layer (Bluetooth, the local network) and its glue, the
  # runtime's network interface over it.
  grassroots_networking:
    path: ../../../networking
  grassroots_networking_core:
    path: ../../../networking/core
  grassroots_networking_glue:
    path: ../../../networking/glue
  redux: ^5.0.0
  cryptography: ^2.9.0
  sodium_libs: ^3.4.4+1
  path_provider: ^2.1.2
  webview_flutter: ^4.10.0
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The GLP tree and the page, laid out flat by tool/sync_assets.sh (gitignored
  # build products: run it before every build).
  assets:
    - assets/manifest.txt
    - assets/bundle/
