<!DOCTYPE html>
<html lang="en" data-theme="fancy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAS</title>
<style>
/* Two looks.  Clean: plain, the contract's own words and terms, as close to the code as a
   page gets.  Fancy: the same, for people: colors, people's faces, counts, friendly words.
   Neither changes the person, their key, the contracts or their certificates. */
[data-theme=clean] { --ink:#1d1d1f; --soft:#6e6e73; --line:#e5e5ea; --bg:#f5f5f7; --card:#fff; --accent:#1d1d1f; --accent2:#ececf0; --onaccent:#fff; --ok:#1d7f3a; --no:#b3261e; --ask:#fff6e0; --r:8px; --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --head:var(--font); --hdbg:rgba(255,255,255,.95); --shadow:none; --page:var(--bg); }
[data-theme=fancy] { --ink:#2b2140; --soft:#7a6f8f; --line:#efe7fb; --bg:#f6f0ff; --card:#fff; --accent:#7b4dff; --accent2:#f0e9ff; --onaccent:#fff; --ok:#12a679; --no:#e8455f; --ask:#fff0f4; --r:20px; --font:ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif; --head:var(--font); --hdbg:rgba(255,255,255,.88); --shadow:0 6px 18px rgba(123,77,255,.10); --page:linear-gradient(160deg,#f6f0ff 0%,#fff4ec 100%); }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; font: 15px/1.45 var(--font); color: var(--ink); background: var(--page); background-attachment: fixed; }
header { position: sticky; top: 0; z-index: 3; background: var(--hdbg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 6px; min-height: 50px; }
header b { flex: 1; font: 700 18px/1.2 var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .st { font-size: 12px; color: var(--soft); white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
header button { border: 0; background: none; color: var(--soft); font: inherit; cursor: pointer; padding: 6px 8px; border-radius: 10px; }
header .back { color: var(--accent); font-size: 22px; line-height: 1; padding: 2px 6px 4px 0; }
header .hood { font: 600 13px ui-monospace, Menlo, Consolas, monospace; }
header .hood.on { background: var(--ink); color: var(--card); }
header .gear { font-size: 19px; }
main { max-width: 560px; margin: 0 auto; padding: 8px 12px 64px; }
.card { background: var(--card); border-radius: var(--r); padding: 12px 14px; margin: 10px 0; box-shadow: var(--shadow); }
h2 { font: 600 12.5px/1.3 var(--font); text-transform: uppercase; letter-spacing: .05em; color: var(--soft); margin: 20px 4px 6px; display: flex; align-items: center; gap: 8px; }
h2 .grow { flex: 1; }
h3 { font: 700 16px/1.3 var(--head); margin: 0 0 6px; }
.row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--soft); }
.small { font-size: 12.5px; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
button.b { border: 0; background: var(--accent); color: var(--onaccent); font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 99px; cursor: pointer; white-space: nowrap; }
button.b.alt { background: var(--accent2); color: var(--ink); }
button.b.ok { background: var(--ok); color: #fff; }
button.b.no { background: var(--no); color: #fff; }
button.b.big { width: 100%; padding: 11px; font-size: 15px; }
button.b:disabled { opacity: .45; cursor: default; }
button.link { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; padding: 0; cursor: pointer; }
input, select { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); width: 100%; min-width: 0; }
.step { display: flex; gap: 10px; align-items: center; padding: 3px 0; }
.step .n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--onaccent); font-size: 12px; display: grid; place-items: center; flex: none; }
.step .n.done { background: var(--ok); color: #fff; }
.ask { background: var(--ask); border-radius: var(--r); padding: 12px 14px; margin: 10px 0; }
.ask .who { font-size: 12px; color: var(--soft); margin-bottom: 2px; text-transform: uppercase; letter-spacing: .04em; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.form { background: var(--bg); border-radius: var(--r); padding: 12px; margin-top: 10px; display: grid; gap: 10px; }
.form label { font-size: 12.5px; color: var(--soft); display: grid; gap: 4px; }
.empty { color: var(--soft); font-size: 13.5px; padding: 4px 0; }
.note { font-size: 12.5px; color: var(--soft); padding: 3px 0; }
.apps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.app { background: var(--card); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; align-content: start; box-shadow: var(--shadow); cursor: pointer; text-align: left; border: 0; font: inherit; color: inherit; position: relative; }
.app .t { font: 700 15px/1.25 var(--head); }
.app .id { font-size: 11.5px; color: var(--soft); letter-spacing: .03em; }
.app .p { font-size: 12.5px; color: var(--soft); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.app .who { display: flex; gap: 3px; min-height: 22px; }
.app .who .dot { width: 22px; height: 22px; font-size: 11px; }
.app .badge { position: absolute; top: 10px; right: 10px; background: var(--no); color: #fff; font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 1px 8px; }
.xbox { max-height: calc(100vh - 300px); min-height: 200px; overflow: auto; background: var(--card); border-radius: var(--r); margin-top: 8px; box-shadow: var(--shadow); }
.xrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.xrow:last-child { border-bottom: 0; }
.xrow .grow { flex: 1; min-width: 0; }
.xrow .sub { display: block; font-size: 12.5px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon { width: 40px; height: 40px; border-radius: 11px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12px; }
.app.add { border: 2px dashed var(--line); background: transparent; box-shadow: none; place-content: center; text-align: center; color: var(--accent); font-weight: 600; min-height: 120px; }
.seg { display: flex; background: var(--accent2); border-radius: 99px; padding: 3px; margin: 10px 0 4px; }
.seg button { flex: 1; border: 0; background: none; font: inherit; font-size: 14px; padding: 6px; border-radius: 99px; color: var(--ink); cursor: pointer; }
.seg button.on { background: var(--card); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.items { display: grid; gap: 6px; }
.item { display: flex; align-items: center; gap: 10px; }
.item .cnt { margin-left: auto; font-weight: 700; }
.dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; }
[data-theme=clean] .dot { display: none; }
.pill { font-size: 12px; background: var(--accent2); border-radius: 99px; padding: 2px 9px; color: var(--soft); white-space: nowrap; }
.clause { padding: 10px 0; border-bottom: 1px solid var(--line); }
.clause:last-child { border-bottom: 0; }
.looks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.look { border: 2px solid transparent; border-radius: 16px; padding: 10px; cursor: pointer; background: var(--page); color: var(--ink); text-align: left; font: inherit; }
.look.on { border-color: var(--accent); }
.look .sw { background: var(--card); border-radius: var(--r); padding: 8px; display: grid; gap: 6px; box-shadow: var(--shadow); }
.look .bar { height: 8px; border-radius: 9px; background: var(--line); }
.look .btn { height: 18px; width: 56%; border-radius: 99px; background: var(--accent); }
.look .nm { font: 700 14px var(--head); margin-top: 8px; }
.look .ds { font-size: 12px; color: var(--soft); }
.qr { display: grid; place-items: center; padding: 8px; }
.qr svg { width: min(72vw, 260px); height: auto; background: #fff; border-radius: 12px; padding: 8px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--card); padding: 9px 16px; border-radius: 99px; font-size: 14px; z-index: 9; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: .95; }
.via { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--accent2); color: var(--soft); font-size: 12px; margin-left: 4px; vertical-align: 1px; }
/* the views read off the contract: tabs, conversations, balances */
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 12px 0 2px; scrollbar-width: none; }
.tabs button { border: 0; background: var(--card); color: var(--soft); font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 99px; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow); }
.tabs button.on { background: var(--accent); color: var(--onaccent); }
.tabs .n { font-size: 11.5px; opacity: .75; }
button.b.sm { font-size: 12.5px; padding: 5px 11px; }
.chats { padding: 4px 0; max-height: calc(100vh - 260px); overflow: auto; }
.chat { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--line); }
.chat:last-child { border-bottom: 0; }
.chat .dot { width: 42px; height: 42px; font-size: 17px; }
.chat .sub { display: block; font-size: 13.5px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bubbles { height: calc(100vh - 128px); height: calc(100dvh - 128px); overflow-y: auto; padding: 10px 2px 6px; display: flex; flex-direction: column; gap: 4px; }
.bub { max-width: 78%; align-self: flex-start; background: var(--card); padding: 7px 10px 5px; border-radius: 16px 16px 16px 5px; box-shadow: 0 1px 2px rgba(0,0,0,.08); word-wrap: break-word; white-space: pre-wrap; }
.bub.me { align-self: flex-end; background: var(--accent); color: var(--onaccent); border-radius: 16px 16px 5px 16px; }
.bub .by { font-size: 12px; font-weight: 700; }
.bub .meta { font-size: 10.5px; opacity: .7; margin-left: 8px; float: right; margin-top: 6px; white-space: nowrap; }
.bub .bad { color: var(--no); font-weight: 800; }
.day { align-self: center; font-size: 11.5px; color: var(--soft); background: var(--card); padding: 2px 10px; border-radius: 99px; margin: 8px 0 4px; }
.composer { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
.composer input { border-radius: 99px; padding: 10px 14px; }
header .dot { width: 30px; height: 30px; }
.bal { display: grid; gap: 10px; margin-top: 10px; }
.coin { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); }
.coin .dot { width: 40px; height: 40px; font-size: 16px; }
.coin .amt { font: 800 24px/1.1 var(--head); }
.plain { border: 2px dashed var(--line); border-radius: var(--r); padding: 0 8px; }
.plan .steps { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 8px 0 4px; font-size: 13px; color: var(--soft); }
.plan .steps .ok { color: var(--ok); font-weight: 600; }
.tog { width: 46px; height: 28px; border-radius: 99px; border: 0; background: var(--line); position: relative; cursor: pointer; flex: none; padding: 0; }
.tog span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .15s; }
.tog.on { background: var(--ok); }
.tog.on span { left: 21px; }
/* the rack turns around */
main { transition: transform .23s ease-in, opacity .23s; transform-origin: 50% 30%; }
main.turn { transform: perspective(1200px) rotateY(90deg); opacity: .3; }
main.turned { animation: turnin .26s ease-out; }
@keyframes turnin { from { transform: perspective(1200px) rotateY(-90deg); opacity: .3; } to { transform: none; opacity: 1; } }
.backpanel { background: repeating-linear-gradient(90deg, #dcdce1 0 2px, #d3d3d9 2px 4px); border-radius: var(--r); padding: 10px 6px 0; margin: 10px 0; box-shadow: inset 0 0 0 1px #c7c7cc; }
.rack { width: 100%; height: auto; display: block; font-family: var(--font); }
header .gear { width: 32px; height: 32px; border-radius: 50%; background: var(--accent2); color: var(--accent); font-weight: 700; font-size: 14px; padding: 0; }
header .gear.on { background: var(--accent); color: var(--onaccent); }
pre { white-space: pre-wrap; word-break: break-all; font-size: 11.5px; max-height: 360px; overflow: auto; background: var(--bg); padding: 8px; border-radius: 8px; margin: 6px 0 0; }
</style>
</head>
<body>
<header id="hd"><b>GAS</b><span class="st">starting…</span></header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script src="qrcode.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
// where the page is: home, '__browse' (all mini-apps), '__friend' (add a friend, the QR),
// '__settings', or a mini-app
let back = null; // where Settings returns to
// the settings button: into Settings, and out again to where the person was
function gearClick() { hood = false; if (open === '__you') go(back); else { back = open; go('__you'); } }
let S = null, open = null, form = null, pane = 'play', naming = null, over = false, conv = null, tab = {};
let names = store.get('gas2names', {});
let myName = store.get('gas2myname', '');
// the person's look, and whether they see under the hood: this page's alone
let theme = 'fancy', hood = false; // hood: the back of the rack, its cables (</>, or Tab)
document.documentElement.dataset.theme = theme;
const fancy = () => theme === 'fancy';
const SITE = 'https://talmonlab.bgu.ac.il/gas/';
const short = k => k ? k.slice(0, 6) : '';
const nm = k => k === S?.me ? 'you' : (names[k] || short(k));
// a person's color, from their key, the same on every device
const hue = k => parseInt((k || '0').slice(0, 6), 16) % 360;
const dot = k => `<span class="dot" style="background:hsl(${hue(k)},55%,52%)">${esc((names[k] || k || '?').slice(0, 1).toUpperCase())}</span>`;
// a message's carrier, as an icon: the relay, Bluetooth, the local network
const VIA = {relay: ['☁︎', 'through the relay'], pan: ['ᛒ', 'over Bluetooth'], lan: ['≋', 'over the local network'], near: ['≋', 'directly']};
const via = v => v && VIA[v] ? `<span class="via" title="${VIA[v][1]}">${VIA[v][0]}</span>` : '';
let toastT = null;
function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

// On the web (bin/web.dart) a person is a token this browser keeps; on a device the
// page is the device's own and there is none.
let token = null;
try { token = localStorage.getItem('gas2token'); } catch (e) {}
const q = new URLSearchParams(location.search);
const DEBUG = q.has('debug');
async function api(path, opts = {}) {
  for (let i = 0; i < 2; i++) {
    const r = await fetch(path, {...opts, cache: 'no-store', headers: token ? {'X-GAS2-Token': token} : {}});
    if (r.status !== 401) return r;
    const j = await r.json().catch(() => ({}));
    if (!j.start) return r;
    token = (await (await fetch('api/start', {method: 'POST'})).json()).token;
    try { localStorage.setItem('gas2token', token); } catch (e) {}
  }
  throw new Error('no person');
}
async function act(j, said) { if (said) toast(said); await api('api/act', {method: 'POST', body: JSON.stringify(j)}); }

// opened with ?add=<link> (the app maker) or ?friend=<key> (a friend's QR): done once ready
let toAdd = q.get('add'), toFriend = q.get('friend'), toApp = (q.get('app') || '').replace(/[^a-z0-9_]/g, '');
// the name the friend gave themselves, for this device to call them by until the person renames them
if (toFriend && q.get('n') && !names[toFriend]) { names[toFriend] = q.get('n').slice(0, 40); store.set('gas2names', names); }
async function poll() {
  let v = -1;
  for (;;) {
    try {
      const r = await api('api/state' + (v >= 0 ? '?since=' + v : '?') + (hood || DEBUG ? '&debug' : ''));
      S = await r.json(); v = S.version; draw(); runPlans();
      if ((toAdd || toFriend) && S.status === 'ready') {
        const l = toAdd, k = toFriend; toAdd = toFriend = null; history.replaceState(null, '', location.pathname);
        if (l) addMade(l);
        if (k && /^[0-9a-f]{64}$/.test(k) && k !== S.me) offerOrAdd(k, toApp);
      }
    } catch (e) { await new Promise(r => setTimeout(r, 2000)); }
  }
}

// --- GLP terms as the host gives them: {f, a}, lists, strings, numbers ---
const F = (t, f) => t && t.f === f ? t.a : null;

// the social_menu spec, a GLP term written as text, read into {f, a}
function parseTerm(s) {
  let i = 0;
  const ws = () => { while (/\s/.test(s[i])) i++; };
  function term() {
    ws();
    if (s[i] === '[') { i++; const xs = []; ws(); if (s[i] === ']') { i++; return xs; }
      for (;;) { xs.push(term()); ws(); if (s[i] === ',') { i++; continue; } if (s[i] === ']') { i++; return xs; } throw 'list'; } }
    if (s[i] === '"' || s[i] === "'") { const q = s[i++]; let o = ''; while (s[i] !== q) { if (s[i] === '\\') i++; o += s[i++]; } i++; return o; }
    let m = /^-?\d+/.exec(s.slice(i)); if (m) { i += m[0].length; return +m[0]; }
    m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(s.slice(i)); if (!m) throw 'term at ' + i;
    i += m[0].length; ws();
    if (s[i] === '(') { i++; const a = []; for (;;) { a.push(term()); ws(); if (s[i] === ',') { i++; continue; } if (s[i] === ')') { i++; break; } throw 'args'; } return {f: m[0], a}; }
    return m[0];
  }
  return term();
}

// the buttons the contract's pragmas name, with the fields each asks for and what it requires
function menuOf(w) {
  const n = F(w, 'named');
  if (!n || typeof n[0] !== 'string' || !n[0].startsWith('social_menu')) return [];
  try {
    const t = parseTerm(n[0]);
    return (F(t, 'social_menu')[0] || []).map(b => {
      const [label, acts] = F(b, 'button');
      return acts.map(a => { const x = F(a, 'act'); return {label, act: x[0], by: x[1], roles: x[2] || [], reqs: (x[3] || []).map(r => F(r, 'req')).filter(Boolean),
        forbs: (x[3] || []).map(r => F(r, 'forb')).filter(Boolean), same: (x[6] || []).map(z => F(z, 'same')).filter(Boolean),
        fields: (x[5] || []).map(f => ({i: F(f, 'field')[0], label: F(f, 'field')[1], kind: F(f, 'field')[2]}))}; });
    }).flat();
  } catch (e) { return []; }
}

// the sentence the contract's pragmas put to a person, its persons by name
function words(ws) {
  return (ws || []).map(w => F(w, 'person') ? '<b>' + esc(nm(F(w, 'person')[0])) + '</b>' : F(w, 'text') ? esc(F(w, 'text')[0])
    : F(w, 'named') ? esc(F(w, 'named')[0]) + ' ' + esc(nm(F(w, 'named')[1])) : F(w, 'valued') ? esc(F(w, 'valued')[0]) + ' ' + esc(F(w, 'valued')[1]) : esc(JSON.stringify(w))).join('');
}

const isKey = t => typeof t === 'string' && t.length === 64 && /^[0-9a-f]+$/.test(t);
// a term for people (fancy), or as the contract writes it (clean)
function termText(t) {
  if (isKey(t)) return nm(t);
  if (typeof t === 'string' || typeof t === 'number') return String(t);
  if (Array.isArray(t)) return t.map(termText).join(', ');
  if (t && t.f === 'speech') { const u = F(t.a[0], 'utterance'); return u ? '“' + u[0] + '”' : termText(t.a[0]); }
  if (t && t.f) return fancy() ? t.f.replace(/_/g, ' ') + (t.a.length ? ' ' + t.a.map(termText).join(', ') : '')
    : t.f + (t.a.length ? '(' + t.a.map(termText).join(', ') + ')' : '');
  return String(t);
}

// a mini-app's draws, read: its last view, notices since, its request and approval questions
function readApp(a) {
  const draws = Object.entries(a.draws || {}).map(([id, d]) => ({id: +id, w: d.w, v: d.v}));
  const out = draws.find(d => d.id === 0);
  const thread = out ? (F(out.v, 'output') || [[]])[0] : [];
  let last = null; const notices = [];
  for (const x of thread) { if (F(x, 'view')) { last = F(x, 'view'); notices.length = 0; } else notices.push(x); }
  return {draws, last, notices, req: draws.find(d => F(d.v, 'request_r')), asks: draws.filter(d => F(d.v, 'approval_w'))};
}

// --- the screens ---
function draw() {
  // what the person is typing survives a redraw
  const keep = {}, focus = document.activeElement?.id;
  document.querySelectorAll('input, select').forEach(e => { if (e.id && e.type !== 'checkbox') keep[e.id] = e.value; });
  const screens = {__you: drawYou, __browse: drawBrowse, __friend: drawFriend};
  if (hood) { drawBack(); return; }
  if (open === '__browse' && document.getElementById('brows')) { bar('Add a mini-app', 'home'); drawBrowseRows(); return; }
  if (screens[open]) screens[open]();

// --- views read off the contract ---------------------------------------------------
// Nothing below names a contract.  What a person holds is shown by what the contract
// says of it: an atom some act adds with a text the person typed, from another person,
// is a conversation (its text a bubble, its other arguments the conversation it is in);
// an atom the pragmas count is a balance; any other atom a list.  An act with one text
// field whose other places a conversation fills writes in it.  An act whose requirements
// bind a place from an atom is offered beside that atom.  The plain view, at the back
// (</>), shows the same state as the contract's words, to check that nothing is lost.
const jeq = (x, y) => JSON.stringify(x) === JSON.stringify(y);
// the atoms anywhere in a schema (under not, times, forall), and the names inside a term
function findAtoms(x, o = []) { if (Array.isArray(x)) x.forEach(y => findAtoms(y, o)); else if (x && x.f) { if (x.f === 'atom') o.push(x); else x.a.forEach(y => findAtoms(y, o)); } return o; }
function namesIn(x, o = []) { if (Array.isArray(x)) x.forEach(y => namesIn(y, o)); else if (x && x.f) x.a.forEach(y => namesIn(y, o)); else if (typeof x === 'string') o.push(x); return o; }
// the words of a text: a Speech, speech(Utterance, Peer), or a string
function said(t) {
  if (t && t.f === 'speech') { const by = t.a[1]; let u = t.a[0]; while (u && u.f === 'speech') u = u.a[0]; const w = F(u, 'utterance'); return {text: w ? String(w[0]) : termText(u), by}; }
  return {text: typeof t === 'string' ? t : termText(t), by: null};
}
const textType = t => t === 'Speech';
function lensOf(a, menu, props) {
  const sh = a.shapes || {}, schemas = sh.schemas || [];
  const types = Object.fromEntries((sh.atoms || []).map(x => [x[0], x[1]]));
  // the types a person types into: those of the buttons' text fields
  const typed = new Set(menu.flatMap(m => m.fields.filter(f => f.kind === 'text').map(f => (argKinds(m.act, props) || [])[f.i - 1])).filter(Boolean));
  // the atoms a button binds a place from: who and what a person picks
  const keyAtoms = new Set(menu.flatMap(m => m.reqs.filter(q => (q[1] || []).length).map(q => q[0])));
  const lens = {};
  for (const sc of schemas) {
    const keyVars = new Set(findAtoms(sc).filter(x => keyAtoms.has(x.a[0])).flatMap(x => namesIn(x.a[1])));
    const states = []; (function w(x) { if (Array.isArray(x)) x.forEach(w); else if (x && x.f) { if (x.f === 'rs') states.push(x); else x.a.forEach(w); } })(sc);
    for (const st of states) for (const x of findAtoms(st.a[1])) {
      const pred = x.a[0], ts = types[pred] || [], args = x.a[1] || [];
      if (lens[pred] || keyAtoms.has(pred)) continue;
      const kinds = args.map((g, i) => g && g.f === 'role' ? 'who' : (typed.has(ts[i]) && namesIn(g).every(v => !keyVars.has(v))) ? 'text' : 'key');
      if (kinds.includes('text')) lens[pred] = {kind: 'thread', by: sc.a[0], kinds, types: ts};
    }
  }
  // the acts that write in a conversation: one text field
  const writers = menu.map((m, i) => ({m, i})).filter(({m}) => m.fields.filter(f => f.kind === 'text').length === 1);
  return {lens, types, keyAtoms, writers, props};
}
// does the person hold an atom the act requires, its places filled by vals
function holdsReq(atoms, pred, as, vals) {
  if (!as.length) return atoms.some(x => x === pred || (x && x.f === pred));
  return atoms.some(x => x && x.f === pred && as.every((z, j) => {
    const at = F(z, 'at'), g = F(z, 'grp');
    if (at) return vals[at[0]] === undefined || jeq(x.a[j], vals[at[0]]);
    if (g) return (vals[g[0]] === undefined || jeq(F(F(x.a[j], 'dot')?.[0], 'community')?.[0], vals[g[0]])) && (vals[g[1]] === undefined || jeq(F(x.a[j], 'dot')?.[1], vals[g[1]]));
    return true;
  }));
}
// an act's places filled from a conversation's values: the person proposes; a value that
// is the person goes to them; each other value to the next place of its type; the text
// field left to type.  null if a value is left over, a place is left empty, or the
// person holds not what the act requires.
function fillFrom(L, m, keyVals, atoms) {
  const kinds = argKinds(m.act, L.props) || [], tf = m.fields.find(f => f.kind === 'text');
  if (!tf) return null;
  const vals = {[m.by || 1]: S.me}, left = keyVals.filter(k => !jeq(k.v, S.me));
  for (let p = 1; p <= kinds.length; p++) {
    if (vals[p] !== undefined || p === tf.i) continue;
    const j = left.findIndex(k => k.t === kinds[p - 1]);
    if (j < 0) return null;
    vals[p] = left[j].v; left.splice(j, 1);
  }
  if (left.length) return null;
  if (!m.reqs.every(([pred, as]) => holdsReq(atoms, pred, as || [], vals))) return null;
  if (m.forbs.some(([pred, as]) => !(as || []).some(z => (F(z, 'at') || [])[0] === tf.i) && holdsReq(atoms, pred, as || [], vals))) return null;
  return vals;
}
const convId = (act, vals, text) => JSON.stringify([act, Object.entries(vals).filter(([p]) => +p !== text).sort((x, y) => x[0] - y[0])]);
const valText = v => isKey(v) ? nm(v) : said(v).text;
const hhmm = t => { if (!t) return ''; const d = new Date(t), n = new Date(); return d.toDateString() === n.toDateString() ? d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', hourCycle: 'h23'}) : d.toLocaleDateString([], {day: 'numeric', month: 'short'}); };
// the conversations: from what the person holds, and from what they sent
function convsOf(a, c) {
  const {r, L} = c, last = r.last || [], atoms = last[1] || [], pend = last[3] || [], seen = a.seen || {};

  return `<div class="card plan"><div class="row" style="border:0;padding:0">${dot(p.peer)}<span class="grow"><b>${esc(a ? a.title.replace(/^Grassroots /, '') : p.app)}</b> with <b>${esc(nm(p.peer))}</b></span>${ready ? `<button class="b" onclick="go('${p.app}');openConv(${esc(JSON.stringify(convId(ready.goal.w.m.act, ready.goal.v, ready.goal.w.m.fields.find(f => f.kind === 'text').i)))})">Open</button>` : ''}<button class="link" onclick="plans=plans.filter(x=>x!==plans[${plans.indexOf(p)}]);savePlans();draw()">✕</button></div>
    <div class="steps">${steps.map(s => `<span class="${s.done ? 'ok' : ''}">${s.done ? '✓' : '·'} ${esc(s.label)}</span>`).join('')}</div>${done ? '' : `<div class="small muted">${p.host ? 'Saying yes for you to ' + esc(nm(p.peer)) + "'s acts that take nothing from you, for 20 minutes." : 'Doing the steps; ' + esc(nm(p.peer)) + ' is asked once.'}</div>`}</div>`;
}
// the link to send: a friend opens it, taps once, and plays this mini-app with you
function inviteLink(app) { return SITE + 'friend.html?k=' + S.me + '&app=' + app + (myName ? '&n=' + encodeURIComponent(myName) : ''); }
function shareInvite(app) {
  const l = store.get('gas2links', []).filter(x => Date.now() - x.t < 7 * 24 * 3600 * 1000 && x.app !== app);
  l.push({app, t: Date.now()}); store.set('gas2links', l);
  share(inviteLink(app));
}
// a friend request while a link of the person's is out: likely from it
function linkFor() { const l = store.get('gas2links', []).filter(x => Date.now() - x.t < 7 * 24 * 3600 * 1000); return l.at(-1); }

// the plain view: the state as the contract's words, everything listed
function plainHtml(a, r, menu, props) {
  const {asks, last, notices, req} = r;
  let h = '';
  // who this person plays with: first, as nothing happens without it
  h += `<h2><span class="grow">Play with</span>${S.friends.length ? '' : `<button class="link" onclick="go('__friend')">Add a friend</button>`}</h2><div class="card">`;
  for (const k of S.friends) {
    const inv = (a.invited || []).includes(k), acc = (a.accepted || []).includes(k);
    h += `<div class="row">${dot(k)}<span class="grow"><b>${esc(nm(k))}</b> ${via((S.lastVia || {})[k])}</span><button class="b ${inv ? 'ok' : 'alt'}" onclick="act({op:'invite',app:'${a.app}',key:'${k}'},'Invited ${esc(nm(k))}')">${inv ? 'Invited ✓' : 'Invite'}</button><button class="b ${acc ? 'ok' : 'alt'}" onclick="act({op:'accept',app:'${a.app}',key:'${k}'},'Accepted ${esc(nm(k))}')">${acc ? 'Accepted ✓' : 'Accept'}</button></div>`;
  }
  if (!S.friends.length) h += `<div class="empty">Add a friend first.</div>`;
  else h += `<div class="small muted" style="padding-top:6px">One of you taps Invite, the other Accept; both need ${esc(a.title)} added.</div>`;
  h += `</div>`;
  // what the contract asks of this person
  for (const d of asks) {
    const ap = F(F(d.v, 'approval_w')[0], 'approval');
    const p = F(ap[2], 'input')[0];
    const ws = ap[1] && ap[1].length ? words(ap[1]) : esc(termText(F(ap[0], 'hello') ? F(ap[0], 'hello')[1] : (F(ap[0], 'attempt') || [])[3]));
    h += `<div class="ask"><div class="who">Asks you</div>${ws}<div class="acts" style="margin-top:10px"><button class="b ok" onclick="grant('${a.app}',${d.id},${JSON.stringify(p)},'yes','Yes, sent')">Yes</button><button class="b alt" onclick="grant('${a.app}',${d.id},${JSON.stringify(p)},'no','No, sent')">No</button></div></div>`;
  }
  if (!last) return h + `<div class="card"><div class="empty">${esc(a.title)} starts once a friend joins you in it.</div></div>`;
  // what this person holds, as the contract's pragmas name it
  const atoms = last[1] || [], known = last[2] || [], pend = last[3] || [], tabs = last[4] || [];
  for (const t of tabs) {
    const [name, pred, how] = F(t, 'tab');
    const xs = atoms.filter(x => x && x.f === pred);
    h += `<h2>${esc(name)}</h2><div class="card"><div class="items">`;
    if (!xs.length) h += `<div class="empty">None yet.</div>`;
    else if (how === 'counted' && fancy()) {
      const c = {};
      for (const x of xs) { const k = JSON.stringify(x.a); c[k] = (c[k] || 0) + 1; }
      for (const [k, n] of Object.entries(c)) { const args = JSON.parse(k); h += `<div class="item">${isKey(args[0]) ? dot(args[0]) : ''}<span>${esc(args.map(termText).join(' · '))}</span><span class="cnt">${n}</span></div>`; }
    } else if (fancy()) for (const k of new Set(xs.map(x => JSON.stringify(x.a)))) { const args = JSON.parse(k); h += `<div class="item">${isKey(args[0]) ? dot(args[0]) : ''}<span>${esc(args.map(termText).join(' · ') || pred)}</span></div>`; }
    else h += `<div class="mono">${xs.map(x => esc(termText(x))).join('<br>')}</div>`;
    h += `</div></div>`;
  }
  const rest = atoms.filter(x => !tabs.some(t => x && x.f === F(t, 'tab')[1]));
  if (rest.length) h += `<h2>Also</h2><div class="card"><div class="items">${[...new Set(rest.map(x => termText(x)))].map(t => `<div class="item"><span class="${fancy() ? '' : 'mono'}">${fancy() ? '✓ ' : ''}${esc(t)}</span></div>`).join('')}</div></div>`;
  if (known.length && !tabs.some(t => F(t, 'tab')[1] === 'knows')) h += `<h2>You know</h2><div class="card"><div class="items">${known.map(k => `<div class="item">${dot(k)}<span>${esc(nm(k))}</span></div>`).join('')}</div></div>`;
  if (pend.length) h += `<div class="card"><div class="small muted">Waiting for the others to answer</div>${pend.map(x => `<div class="note">${esc(termText(x))}${fancy() ? '…' : ''}</div>`).join('')}</div>`;
  for (const n of notices) h += `<div class="note">${esc(termText(n))}</div>`;
  // what this person can do: the contract's buttons
  if (req) {
    const acts = menu.length ? menu : props.map(p => ({label: p[1], act: p[1], fields: []}));
    h += `<h2>Do</h2><div class="card"><div class="acts">`;
    acts.forEach((m, i) => { h += `<button class="b ${form && form.i === i ? '' : 'alt'}" onclick="pick(${i})">${esc(fancy() ? m.label : m.act)}</button>`; });
    h += `</div>`;
    if (form) h += formHtml(acts[form.i], props, last);
    h += `</div>`;
  }
  return h;
}

function rulesHtml(a) {
  const ab = a.about || {}, cs = ab.clauses || [];
  const mod = {'■': 'enforced', '◆': 'attested', '○': 'undertaken'};
  let h = `<div class="card"><h3>${esc(a.title)} <span class="muted small">${esc(a.id)}</span></h3><div class="muted">${esc(ab.preamble || '')}</div></div>`;
  if (!cs.length) return h + `<div class="card"><div class="empty">The contract's words did not come with this mini-app.</div></div>`;
  h += `<div class="card">${cs.map(c => `<div class="clause"><div class="row" style="padding:0;border:0"><b class="grow">${c.n}. ${esc(c.name)}</b><span class="pill">${esc(mod[c.mod] || c.mod)}</span></div><div>${esc(c.text)}</div></div>`).join('')}</div>`;
  return h + `<div class="small muted" style="margin:6px 4px">Enforced: the app does not let it be broken. Attested: it is signed for. Undertaken: each person promises it.</div>`;
}

// --- the back of the rack: what is wired to what, and the signals on the wires ---
function drawBack() {
  const a = open && S.apps.find(x => x.app === open);
  bar(a ? a.title + ' · the back' : 'The back', null);
  const apps = a ? [a] : S.apps.filter(x => x.installed);
  const friends = S.friends;
  const near = new Map((S.nearby || []).map(p => [p.key, p.over]));
  // the rack: on a wide screen three columns (the super-app, its mini-apps, the friends) and
  // the network below; on a phone the same, stacked
  const narrow = innerWidth < 640;
  const uw = narrow ? 164 : 168, uh = 44, gap = 12;
  const pos = {};
  let W, H, heads;
  if (!narrow) {
    const x0 = 14, x1 = 236, x2 = 458, y = i => 40 + i * (uh + gap);
    const rows = Math.max(apps.length, friends.length, 2);
    W = 640; H = 40 + rows * (uh + gap) + 76;
    pos.sa = [x0, y(0)]; pos.you = [x0, y(1)];
    apps.forEach((m, i) => pos['a' + i] = [x1, y(i)]);
    friends.forEach((k, j) => pos['f' + j] = [x2, y(j)]);
    pos.relay = [x1 - 60, H - 60]; pos.near = [x2, H - 60];
    heads = [[x0, 'YOUR SUPER-APP'], [x1, a ? 'THIS MINI-APP' : 'MINI-APPS'], [x2, 'FRIENDS']].map(([x, t]) => [x, 22, t]);
  } else {
    W = 360; const cx = [10, 186];
    let yy = 30;
    heads = [[10, 22, 'YOUR SUPER-APP']];
    pos.sa = [cx[0], yy]; pos.you = [cx[1], yy]; yy += uh + 34;
    heads.push([10, yy - 8, a ? 'THIS MINI-APP' : 'MINI-APPS']);
    apps.forEach((m, i) => { pos['a' + i] = [cx[i % 2], yy + Math.floor(i / 2) * (uh + gap)]; });
    yy += Math.max(1, Math.ceil(apps.length / 2)) * (uh + gap) + 34;
    heads.push([10, yy - 8, 'FRIENDS']);
    friends.forEach((k, j) => { pos['f' + j] = [cx[j % 2], yy + Math.floor(j / 2) * (uh + gap)]; });
    yy += Math.max(1, Math.ceil(friends.length / 2)) * (uh + gap) + 34;
    heads.push([10, yy - 8, 'THE NETWORK']);
    pos.relay = [cx[0], yy]; pos.near = [cx[1], yy];
    H = yy + uh + 14;
  }
  const hueA = id => [...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  let g = '';
  const unit = (p, title, sub, col) => { const [x, yy] = p; return `<g><rect x="${x}" y="${yy}" width="${uw}" height="${uh}" rx="5" fill="#4a4a50" stroke="#2c2c30"/>
    <circle cx="${x + 7}" cy="${yy + 7}" r="2.2" fill="#8a8a92"/><circle cx="${x + 7}" cy="${yy + uh - 7}" r="2.2" fill="#8a8a92"/><circle cx="${x + uw - 7}" cy="${yy + 7}" r="2.2" fill="#8a8a92"/><circle cx="${x + uw - 7}" cy="${yy + uh - 7}" r="2.2" fill="#8a8a92"/>
    <rect x="${x + 14}" y="${yy + 10}" width="4" height="${uh - 20}" rx="2" fill="${col}"/>
    <text x="${x + 24}" y="${yy + 20}" font-size="12.5" font-weight="700" fill="#f2f2f5">${esc(String(title).slice(0, 18))}</text><text x="${x + 24}" y="${yy + 35}" font-size="10.5" fill="#c7c7cf" font-family="ui-monospace,Menlo,monospace">${esc(String(sub).slice(0, 22))}</text></g>`; };
  // where a cable plugs in: the side of a unit facing the other one
  const plug = (p, q) => {
    const [x, yy] = p, [qx, qy] = q;
    if (Math.abs(qy - yy) > uh) return [x + uw / 2 + (qx > x + 10 ? 30 : qx < x - 10 ? -30 : 0), qy > yy ? yy + uh - 4 : yy + 4];
    return [qx > x ? x + uw - 4 : x + 4, yy + uh / 2];
  };
  const jack = ([x, yy]) => `<circle cx="${x}" cy="${yy}" r="5.5" fill="#1d1d20" stroke="#9a9aa2" stroke-width="1.5"/>`;
  let cables = '', jacks = '';
  const cable = (p, q, col) => {
    const A = plug(p, q), B = plug(q, p), dx = B[0] - A[0], dy = B[1] - A[1];
    const sag = 22 + Math.abs(dx) * .08 + Math.abs(dy) * .08;
    const c1 = Math.abs(dy) > uh ? [A[0], A[1] + Math.sign(dy) * 40 + sag * .4] : [A[0] + Math.sign(dx) * 50, A[1] + sag];
    const c2 = Math.abs(dy) > uh ? [B[0], B[1] - Math.sign(dy) * 40 + sag * .4] : [B[0] - Math.sign(dx) * 50, B[1] + sag];
    cables += `<path d="M${A[0]},${A[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${B[0]},${B[1]}" fill="none" stroke="${col}" stroke-width="4.5" stroke-linecap="round" opacity=".92"/>`;
    jacks += jack(A) + jack(B);
  };
  g += unit(pos.sa, 'Super-app', S.status === 'ready' ? 'ready' : S.status, '#7b4dff');
  g += unit(pos.you, myName || 'You', short(S.me) + '…', `hsl(${hue(S.me)},55%,52%)`);
  apps.forEach((m, i) => {
    const col = `hsl(${hueA(m.id)},62%,55%)`, r = readApp(m);
    g += unit(pos['a' + i], m.title.replace(/^Grassroots /, ''), 'v ' + m.version + (r.asks.length ? ' · ' + r.asks.length + ' ask' : '') + (r.last && (r.last[3] || []).length ? ' · ' + r.last[3].length + ' wait' : ''), col);
    cable(pos.sa, pos['a' + i], col);
    friends.forEach((k, j) => { if ((m.invited || []).includes(k) || (m.accepted || []).includes(k)) cable(pos['a' + i], pos['f' + j], col); });
  });
  friends.forEach((k, j) => {
    g += unit(pos['f' + j], nm(k), short(k) + '…', `hsl(${hue(k)},55%,52%)`);
    const last = (S.lastVia || {})[k], over = near.get(k);
    if (last === 'relay') cable(pos['f' + j], pos.relay, '#a1a1a6');
    else if (last || (over && over.length)) cable(pos['f' + j], pos.near, '#2bb3a0');
  });
  const empty = (p, t) => `<text x="${p[0] + uw / 2}" y="${p[1] + 26}" text-anchor="middle" font-size="12" fill="#6e6e73">${t}</text>`;
  if (!apps.length) g += empty(narrow ? [10, pos.sa[1] + uh + 34] : [236, 40], 'no mini-app yet');
  if (!friends.length) g += empty(narrow ? [10, (pos.relay[1] - uh - 46)] : [458, 40], 'no friend yet');
  g += unit(pos.relay, 'Relay', 'talmonlab · sealed', '#8e8e93');
  g += unit(pos.near, 'Bluetooth · Wi-Fi', near.size ? near.size + ' near' : 'nobody near', '#169482');
  cable(pos.you, pos.relay, '#a1a1a6');
  const svg = `<svg viewBox="0 0 ${W} ${H}" class="rack" role="img" aria-label="The back: what is wired to what">
    ${heads.map(([x, yy, t]) => `<text x="${x}" y="${yy}" font-size="11" fill="#6e6e73" letter-spacing=".08em">${t}</text>`).join('')}
    ${g}${cables}${jacks}</svg>`;
  let h = `<div class="backpanel">${svg}<div class="small muted" style="padding:2px 6px 8px">A cable from a mini-app to a friend: you invited them, or took their invitation. Tab, or &lt;/&gt;, turns the rack around again.</div></div>`;
  if (a) h += hoodHtml(a);
  const ws = S.wires || [];
  h += `<h2>Messages, and their carrier</h2><div class="card" style="max-height:300px;overflow:auto">${ws.length ? ws.slice(0, 40).map(w => `<div class="row" style="padding:5px 0"><span class="mono muted" style="width:62px">${new Date(w.t).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'})}</span><span>${w.out ? '↑ to' : '↓ from'}</span>${dot(w.key).replace('class="dot"', 'class="dot" style="width:22px;height:22px;font-size:11px;background:hsl(' + hue(w.key) + ',55%,52%)"')}<span class="grow">${esc(nm(w.key))}</span>${via(w.via)}<span class="small muted">${esc((VIA[w.via] || [0, w.via])[1])}</span></div>`).join('') : '<div class="empty">No message yet.</div>'}</div>`;
  h += `<h2>Signals</h2><div class="card"><div class="small">Status: ${esc(S.status)} · acts waiting: ${esc(JSON.stringify(S.pending || []))} s · state version ${S.version}</div><pre>${esc((S.log || []).join('\n'))}</pre></div>`;
  $('#main').innerHTML = h;
}

function hoodHtml(a) {
  const c = appCtx(a), r = c.r, L = c.L;
  const tabs = r.last ? (r.last[4] || []).map(t => F(t, 'tab')) : [];
  const lensRow = ([name, pred, how]) => {
    const l = L.lens[pred];
    const what = l ? `a conversation: ${l.kinds.map((k, i) => k === 'text' ? '<b>text</b>' : k === 'who' ? 'from' : 'in').join(', ')} (added by ${esc(l.by)})` : how === 'counted' ? 'a balance (the pragmas count it)' : 'a list';
    const binds = window._acts.filter(m => (m.reqs || []).some(q => q[0] === pred && (q[1] || []).length)).map(m => m.label);
    return `<div class="row"><span class="grow"><b>${esc(name)}</b> <span class="mono">${esc(pred)}</span><span class="sub small muted" style="display:block">${what}${binds.length ? ' · beside it: ' + esc(binds.join(', ')) : ''}</span></span></div>`;
  };
  return `<h2>What the main view reads off the contract</h2><div class="card">${tabs.length ? tabs.map(lensRow).join('') : '<div class="empty">No view yet.</div>'}
    <div class="row"><span class="grow small muted">Writes in a conversation: ${esc(L.writers.map(w => w.m.label).join(', ') || 'nothing')}. Atoms no tab shows are under Also; every act is under Do.</span></div></div>
    <h2>The plain view</h2><div class="plain">${a.installed ? plainHtml(a, r, c.menu, c.props) : '<div class="card"><div class="empty">Not added.</div></div>'}</div>
    <div class="card"><div class="row"><span class="grow">Contract</span><b>${esc(a.id)}</b> <a class="small" href="${SITE}contract.html?c=${encodeURIComponent(a.id)}" target="_blank">on the site</a></div><div class="row"><span class="grow">Mini-app</span><span class="mono">${esc(a.app)}</span></div><div class="row"><span class="grow">Version (its files)</span><span class="mono">${esc(a.version)}</span></div>
    <div class="small muted" style="margin-top:6px">The person you play with needs the same version.</div></div>
    <h2>The view, raw</h2><div class="card"><pre>${esc(JSON.stringify(r.last, null, 1))}</pre></div>
    <h2>Every draw</h2><div class="card"><pre>${esc(JSON.stringify(r.draws, null, 1))}</pre></div>`;
}

function pick(i, pre) { form = form && form.i === i && !pre ? null : {i, pre}; if (pre) { conv = null; } draw(); if (pre) document.querySelector('.form')?.scrollIntoView({block: 'center'}); }
const argKinds = (act, props) => (props.find(x => x[1] === act) || [0, 0, []])[2];

function formHtml(m, props, last, pre = {}) {
  const kinds = argKinds(m.act, props), atoms = last[1] || [];
  const people = [...new Set([...(last[2] || []), ...S.friends])].filter(k => k !== S.me);
  pre = pre || {};
  const sel = (i, label, ks) => { if (pre[i] !== undefined && !ks.some(k => jeq(k, pre[i]))) ks = [pre[i], ...ks];
    window._choices[i] = ks;
    return `<label>${esc(label)}<select id="arg${i}">${ks.length ? ks.map((k, n) => `<option value="${n}" ${jeq(k, pre[i]) ? 'selected' : ''}>${esc(termText(k))}</option>`).join('') : '<option value="">(none yet)</option>'}</select></label>`; };
  window._choices = {};
  let h = `<div class="form">`;
  // a group the act requires the proposer to be in, grp(J, K): its owner at J, its name at K, picked as one
  const grps = (m.reqs || []).flatMap(([pred, as]) => (as || []).map((z, j) => [pred, j, F(z, 'grp')]).filter(g => g[2]));
  const inGrp = i => grps.find(g => g[2][0] === i || g[2][1] === i);
  kinds.forEach((t, j) => {
    const i = j + 1;
    if (i === (m.by || 1)) return;
    const g = inGrp(i);
    if (g) {
      const own = g[2][0] === (m.by || 1);
      if (i !== (own ? g[2][1] : g[2][0])) return;
      const cs = [...new Set(atoms.filter(x => x && x.f === g[0]).map(x => JSON.stringify(x.a[g[1]])))].map(x => JSON.parse(x))
        .map(c => [F(F(c, 'dot')?.[0], 'community')?.[0], F(c, 'dot')?.[1]]).filter(c => c[0] !== undefined && (!own || c[0] === S.me));
      const pv = pre[g[2][1]] !== undefined ? [own ? S.me : pre[g[2][0]], pre[g[2][1]]] : null;
      window._choices['g' + g[2][0]] = cs;
      h += `<label>${esc(g[0].replace(/_/g, ' '))}<select id="grp${g[2][0]}">${cs.length ? cs.map((c, n) => `<option value="${n}" ${pv && jeq(c, pv) ? 'selected' : ''}>${esc(valText(c[1]) + ' · ' + nm(c[0]))}</option>`).join('') : '<option value="">(none yet)</option>'}</select></label>`;
      return;
    }
    const f = m.fields.find(x => x.i === i);
    // an argument the act requires the proposer to hold: chosen from what they hold
    const req = (m.reqs || []).find(r => (r[1] || []).some(z => (F(z, 'at') || [])[0] === i));
    const role = (m.roles || []).includes(i);
    if (f && (t === 'Peer' || t === 'Key')) h += sel(i, f.label, people);
    else if (f && t === 'Integer') h += `<label>${esc(f.label)}<input id="arg${i}" type="number" min="1" step="1" value="1" inputmode="numeric"></label>`;
    else if (f) h += `<label>${esc(f.label)}<input id="arg${i}" type="text"></label>`;
    else if (req && req[0] === 'knows') h += sel(i, role ? 'with' : 'person', (last[2] || []).filter(k => k !== S.me));
    else if (req) h += sel(i, req[0].replace(/_/g, ' ') + ' of', [...new Set(atoms.filter(x => x && x.f === req[0]).map(x => x.a[0]))]);
    else if (t === 'Peer' || t === 'Key') h += sel(i, role ? 'with' : 'person', people);
    else if (t === 'Integer') h += `<label>${esc(t.toLowerCase())}<input id="arg${i}" type="number" min="1" step="1" value="1" inputmode="numeric"></label>`;
    else h += `<label>${esc(t.toLowerCase())}<input id="arg${i}" type="text"></label>`;
  });
  h += `<div><button class="b" onclick="propose()">${esc(fancy() ? m.label : m.act)}</button></div></div>`;
  return h;
}

async function propose() {
  const m = window._acts[form.i], kinds = argKinds(m.act, window._props);
  const grps = (m.reqs || []).flatMap(([pred, as]) => (as || []).map(z => F(z, 'grp')).filter(Boolean));
  const args = kinds.map((t, j) => {
    const i = j + 1;
    if (i === (m.by || 1)) return S.me;
    const g = grps.find(g => g[0] === i || g[1] === i);
    if (g) { const el = document.getElementById('grp' + g[0]), c = (window._choices || {})['g' + g[0]]; if (!el || el.value === '' || !c) return ''; return c[+el.value][g[0] === i ? 0 : 1]; }
    const el = document.getElementById('arg' + i);
    if (el && el.tagName === 'SELECT') { const k = (window._choices || {})[i]; return el.value === '' || !k ? '' : k[+el.value]; }
    const v = el?.value ?? '';
    if (t === 'Integer') return parseInt(v || '0', 10);
    if (t === 'Speech') return {f: 'speech', a: [{f: 'utterance', a: [v]}, S.me]};
    return v;
  });
  if (args.some(x => x === '')) return toast('Pick a value for each field');
  const p = F(F(window._req.v, 'request_r')[0], 'input')[0];
  form = null;
  await grant(window._app, window._req.id, p, {propose: {f: m.act, a: args}}, m.label + ': sent');
}
async function grant(app, id, path, value, said) { await act({op: 'grant', app, id, path, value}, said); }

// a mini-app's page, at its rules (from the list of all of them)
function details(app) { go(app); pane = S.apps.find(a => a.app === app)?.installed ? 'play' : 'rules'; draw(); }
function go(where) { open = where; form = null; pane = 'play'; over = false; naming = null; conv = null; draw(); window.scrollTo(0, 0); }
function install(app) { act({op: 'install', app}, 'Adding: your device certifies it'); }
// </>: the rack turns around, as in a studio's rack: the back shows the cables
function flip() {
  const m = $('#main');
  m.classList.add('turn');
  setTimeout(() => { hood = !hood; if (hood) api('api/state?debug').then(r => r.json()).then(j => { S.log = j.log; S.pending = j.pending; S.wires = j.wires; if (hood) draw(); }).catch(() => {}); draw(); m.classList.remove('turn'); m.classList.add('turned'); setTimeout(() => m.classList.remove('turned'), 260); }, 230);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Tab' && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) { e.preventDefault(); flip(); }
});
function saveName(k) { const v = ($('#nm')?.value || '').trim(); if (v) names[k] = v; else delete names[k]; store.set('gas2names', names); naming = null; draw(); }
function copyText(s, said) {
  if (window.GASNative) window.GASNative.postMessage(JSON.stringify({copy: s}));
  else navigator.clipboard?.writeText(s);
  toast(said);
}
async function share(link) {
  if (navigator.share) { try { await navigator.share({title: 'Add me on GAS', url: link}); return; } catch (e) {} }
  copyText(link, 'Link copied: send it to your friend');
}
// the device's back button: out of a screen
window.gas2Back = () => { if (hood) flip(); else if (open) go(null); };
async function addKey(k) {
  const r = await (await api('api/add', {method: 'POST', body: JSON.stringify({key: k})})).json();
  if (r.error) return toast(r.error);
  toast('Asked ' + short(k) + ' to be your friend');
  if (open === '__friend') go(null);
  naming = k; draw();
}
function addPasted() {
  const v = ($('#add')?.value || '').trim();
  const k = (/[0-9a-f]{64}/i.exec(v) || [''])[0].toLowerCase();
  if (!k) return toast('That is not a key');
  if (k === S.me) return toast('That is your own key');
  offerOrAdd(k, ((/[?&]app=([a-z0-9_]+)/.exec(v) || [])[1] || ''));
}
// a link with a mini-app: one tap plays it with them (the steps, done for the person); else a friend request
function offerOrAdd(k, app) {
  if (app && ui.steps && S.apps.some(a => a.app === app)) { offers = offers.filter(o => o.peer !== k).concat([{peer: k, app}]); go(null); return; }
  addKey(k);
}
function addMade(link) {
  link = link || $('#madelink')?.value.trim();
  if (!link) return;
  // a maker's code alone: the site's file of that mini-app
  if (/^[0-9a-f]{16}$/i.test(link)) link = SITE + 'made/' + link.toLowerCase() + '.json';
  act({op: 'add', link}, 'Adding the mini-app…'); if ($('#madelink')) $('#madelink').value = '';
}
// start over: a new key pair, nothing kept, here and on the device or the server
async function startOver() {
  await api('api/reset', {method: 'POST'});
  try { localStorage.removeItem('gas2token'); localStorage.removeItem('gas2names'); } catch (e) {}
  document.body.innerHTML = '<p style="padding:24px;color:#6e6e73">Starting over…</p>';
  // the page comes back with the new person (in the app, the app opens it again)
  for (;;) {
    await new Promise(r => setTimeout(r, 3000));
    try { if ((await fetch('api/state', {cache: 'no-store'})).status) { location.replace(location.pathname); return; } } catch (e) {}
  }
}

poll();
setInterval(runPlans, 5000);
</script>
