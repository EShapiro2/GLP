<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're invited · GAS, the GLP app store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--ink2:#3a3a3c;--mute:#6e6e73;--blue:#0a7aff;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
header{background:rgba(245,245,247,.82);border-bottom:1px solid rgba(0,0,0,.06)}
.hin{max-width:1120px;margin:0 auto;padding:10px 24px;display:flex;align-items:center}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px;color:var(--ink)}
.logo .mark{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,#4f7bd9,#2bb3a0,#9b7bd4,#f0b54a,#4f7bd9)}
main{max-width:560px;margin:0 auto;padding:36px 24px 80px}
h1{font-size:clamp(30px,6vw,40px);letter-spacing:-.025em;line-height:1.1;margin:6px 0 10px;font-weight:800}
.lead{font-size:17px;color:var(--ink2);margin:0 0 22px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:14px}
.step{display:flex;gap:14px}
.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.step h2{font-size:18px;margin:2px 0 4px}
.step p{margin:0 0 8px;color:var(--ink2);font-size:15px}
.btn{border:none;border-radius:999px;padding:10px 20px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.blue{background:var(--blue);color:#fff}
.btn.grey{background:rgba(118,118,128,.12);color:var(--blue)}
.who{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.small{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hin"><a class="logo" href="./"><span class="mark"></span>GAS · the GLP app store</a></div></header>
<main id="m"></main>
<script>
// An invite: the inviting person's key after the '#', and the app they invite
// to, by its hash (&c=), which the browser never sends to the server.  The
// page helps the invited person get GAS and open the invite in it.
const [key, app] = [(location.hash.match(/^#([0-9a-fA-F]{64})/) || [])[1], (location.hash.match(/[&?]c=([0-9a-f]{64})/) || [])[1]];
const m = document.getElementById('m');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function show(c){
  const hue = parseInt(key.slice(0, 6), 16) % 360;
  const open = 'gas://add/' + key.toLowerCase() + (app ? '?c=' + app : '');
  m.innerHTML = `<h1>You're invited to GAS</h1>
  <p class="lead"><span class="who" style="background:hsl(${hue} 60% 55%)"></span><b>Person ${key.slice(0, 4)}</b> wants to connect with you${c ? ` in <b>${esc(c.icon)} ${esc(c.title)}</b>` : ''} on GAS, apps run by the people who use them, on their own phones.</p>
  <div class="card step"><div class="n">1</div><div><h2>Get GAS</h2><p>If you have it already, skip this.</p><a class="btn blue" href="download.html">Get the app</a></div></div>
  <div class="card step"><div class="n">2</div><div><h2>Open the invite in GAS</h2><p>GAS gets ${c ? esc(c.title) : 'the app'} if you do not have it, opens it, and adds this person.</p>
    <a class="btn blue" href="${open}">Open in GAS</a> <button class="btn grey" id="cp">Copy link</button> <span class="small" id="ok"></span>
    <p class="small" style="margin-top:8px">If nothing opens: copy the link, open GAS, tap 🔗 at the top, and Open.</p></div></div>
  <div class="card step"><div class="n">📱</div><div><h2>No app? Use it in the browser</h2><p>On an iPhone, or anywhere: GAS on the web runs your agent on talmonlab.</p><a class="btn grey" href="/gasweb/#/link/${encodeURIComponent(location.href)}">Open in the browser</a></div></div>
  <p class="small">Your messages to each other go through talmonlab's relay, encrypted end to end between your two phones.</p>`;
  document.getElementById('cp').onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); document.getElementById('ok').textContent = 'Copied.'; }
    catch (e) { prompt('Copy this link:', location.href); }
  };
}
if (!key){
  m.innerHTML = `<h1>This invite link is incomplete</h1><p class="lead">Ask for the link again, and copy all of it. <a href="download.html">Get the app</a>.</p>`;
} else if (!app) show(null);
else fetch('/downloads/catalog.json', {cache: 'no-store'}).then(r => r.json())
  .then(j => show(j.contracts.find(c => c.hash === app))).catch(() => show(null));
</script>
</body>
</html>
