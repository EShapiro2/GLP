<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get an app · GAS, the GLP app store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--ink2:#3a3a3c;--mute:#6e6e73;--blue:#0a7aff;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
header{background:rgba(245,245,247,.82);border-bottom:1px solid rgba(0,0,0,.06)}
.hin{max-width:1120px;margin:0 auto;padding:10px 24px;display:flex;align-items:center}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px;color:var(--ink)}
.logo .mark{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,#4f7bd9,#2bb3a0,#9b7bd4,#f0b54a,#4f7bd9)}
main{max-width:560px;margin:0 auto;padding:36px 24px 80px}
.app{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.ic{width:64px;height:64px;border-radius:16px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none}
h1{font-size:clamp(26px,6vw,34px);letter-spacing:-.02em;line-height:1.1;margin:0 0 4px;font-weight:800}
.lead{color:var(--ink2);margin:0}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:14px}
.card h2{font-size:18px;margin:0 0 6px}
.card p{margin:0 0 10px;color:var(--ink2);font-size:15px}
.btn{border:none;border-radius:999px;padding:10px 20px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;margin:2px 6px 2px 0}
.btn.blue{background:var(--blue);color:#fff}
.btn.grey{background:rgba(118,118,128,.12);color:var(--blue)}
.small{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<header><div class="hin"><a class="logo" href="./"><span class="mark"></span>GAS · the GLP app store</a></div></header>
<main id="m"></main>
<script>
// An app to get: its hash after the '#'.  The app checks what it downloads
// against the hash, so this page only helps the person get it there.
const h = (location.hash.slice(1).match(/^[0-9a-f]{64}$/) || [])[0];
const m = document.getElementById('m');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function show(c){
  m.innerHTML = `<div class="app"><div class="ic">${c ? esc(c.icon) : '📄'}</div><div><h1>${c ? esc(c.title) : 'An app on GAS'}</h1>
    <p class="lead">${c ? esc(c.about) : ''}</p></div></div>
  <div class="card"><h2>Have GAS?</h2><p>Open it here, and it gets the app.</p>
    <a class="btn blue" href="gas://get/${h}">Open in GAS</a><button class="btn grey" id="cp">Copy link</button> <span class="small" id="ok"></span>
    <p class="small" style="margin-top:8px">If nothing opens: copy the link, open GAS, tap 🔗 at the top, and Open.</p></div>
  <div class="card"><h2>No GAS yet?</h2><p>Get it first, then come back to this page.</p><a class="btn grey" href="download.html">Get GAS</a></div>
  ${c ? '' : '<p class="small">This app is not in GAS\'s catalog; GAS may still get it if someone published it unlisted.</p>'}`;
  document.getElementById('cp').onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); document.getElementById('ok').textContent = 'Copied.'; }
    catch (e) { prompt('Copy this link:', location.href); }
  };
}
if (!h) m.innerHTML = '<h1>This link is incomplete</h1><p class="lead">Ask for it again, and copy all of it.</p>';
else fetch('/downloads/catalog.json', {cache: 'no-store'}).then(r => r.json())
  .then(j => show(j.contracts.find(c => c.hash === h))).catch(() => show(null));
</script>
</body>
</html>
