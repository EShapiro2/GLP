# Knot DNS configuration for the peoplesweb.org apex name server (GPW).
# Deployed to /etc/knot/knot.conf on vps3492120 (162.35.180.99).
# Spec: GPW paper Section 6 (Names) and GPW/docs/data-types-and-servers.md;
# work plan GPW/docs/server-work-plan-2026-07-12.md, Stage 1.

server:
    rundir: "/run/knot"
    user: knot:knot
    automatic-acl: on
    listen: [ 0.0.0.0@53, ::@53 ]

log:
  - target: syslog
    any: info

database:
    storage: "/var/lib/knot"

zone:
    # The apex zone, served by the federation (this VPS).  Stage 2 adds the
    # thin name-server service writing address records via knotc/dynamic
    # update; delegations to community zones are written here as communities
    # are created.
  - domain: peoplesweb.org
    storage: "/var/lib/knot/zones"
    file: "peoplesweb.org.zone"
