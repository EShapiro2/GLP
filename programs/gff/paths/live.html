<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFF live</title>
<!-- Plays the acts of async_sim.py's runs, made by live.py (on demand, or in
     live-data.js, generated) on the grid: following (GDO-L:1) and delivery with
     one contract's act: shortening (GFF-PS:1), redundant following (GFF-FR:1)
     or redundant following with the back-channel (GFF-FR-BC:1). -->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --line: #2a78d6; --intro: #eb6834; --critical: #d03b3b;
  --ramp: #86b6ef,#6da7ec,#5598e7,#3987e5,#2a78d6,#256abf,#1c5cab,#184f95,#104281,#0d366b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --line: #3987e5; --intro: #d95926; --critical: #d03b3b;
    --ramp: #184f95,#1c5cab,#256abf,#2a78d6,#3987e5,#5598e7,#6da7ec,#86b6ef,#9ec5f4,#cde2fb;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --line: #3987e5; --intro: #d95926; --critical: #d03b3b;
  --ramp: #184f95,#1c5cab,#256abf,#2a78d6,#3987e5,#5598e7,#6da7ec,#86b6ef,#9ec5f4,#cde2fb;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 20px; margin: 0 0 2px; }
.sub { color: var(--ink2); margin: 0 0 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.controls label { color: var(--ink2); font-size: 13px; display: flex; gap: 6px; align-items: center; }
select, button { font: inherit; color: var(--ink); background: var(--page);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; min-width: 34px; }
button.primary { background: var(--ink); color: var(--surface); min-width: 70px; }
.scrub { display: flex; gap: 10px; align-items: center; width: 100%; }
.scrub input { flex: 1; }
.num { font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 13px; white-space: nowrap; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; margin-top: 14px; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.stage { position: relative; }
canvas#grid { width: 100%; aspect-ratio: 1 / 1; display: block; border-radius: 6px;
  touch-action: none; cursor: grab; }
canvas#grid.dragging { cursor: grabbing; }
.zoombar { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.zoombar button { background: var(--surface); padding: 2px 6px; font-size: 13px; }
.zoombar .num { text-align: center; background: var(--surface); border-radius: 4px; }
.world { margin-bottom: 10px; }
.world input[type=number] { width: 76px; }
.world input[type=text] { width: 150px; }
.world input { font: inherit; color: var(--ink); background: var(--page);
  border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
.world input:disabled, .world button:disabled { opacity: 0.5; }
.world .status { color: var(--ink2); font-size: 13px; }
.world .status.err { color: var(--critical); }
.world .wtitle { font-weight: 600; font-size: 13px; }
.params { margin-top: 16px; }
.params h3 { font-size: 14px; margin: 14px 0 6px; }
.params h3:first-of-type { margin-top: 2px; }
.params dl { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 6px 14px; margin: 0; }
@media (max-width: 640px) { .params dl { grid-template-columns: minmax(0, 1fr); gap: 2px; } .params dd { margin-bottom: 8px; } }
.params dt { font-weight: 600; }
.params dd { margin: 0; color: var(--ink2); }
.params dd b { color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; color: var(--ink2); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.ln { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.ramp { width: 90px; height: 10px; border-radius: 3px; display: inline-block; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.tile .k { color: var(--ink2); font-size: 12px; }
.tile .v { font-size: 20px; font-weight: 600; }
.tile .d { color: var(--muted); font-size: 12px; }
h2 { font-size: 13px; color: var(--ink2); font-weight: 600; margin: 14px 0 6px; }
#chart { width: 100%; height: 150px; display: block; cursor: pointer; }
#log { list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--ink2); min-height: 108px; }
#log li { padding: 2px 0; border-bottom: 1px solid var(--grid); }
#log li:first-child { color: var(--ink); }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15); display: none; white-space: nowrap; z-index: 2; }
.chartwrap { position: relative; }
.phase { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px;
  border: 1px solid var(--border); color: var(--ink2); }
.help { color: var(--ink2); font-size: 13px; margin-top: 16px; max-width: 900px; }
.help p { margin: 6px 0; }
.empty { padding: 40px; text-align: center; color: var(--ink2); }
code { font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>GFF live</h1>
  <p class="sub" id="sub">Following through friends (GDO-L:1) and one act that improves the paths, by contract: GFF-PS, GFF-FR or GFF-FR-BC, act by act in continuous time.</p>
  <div id="app"></div>
</div>
<script src="live-data.js"></script>
<script>
"use strict";
let D = window.GFF_LIVE;
const SERVER = !!window.GFF_SERVER;
const app = document.getElementById("app");
if (!D) {
  app.innerHTML = '<div class="card empty">No data. Run <code>python3 live.py --serve --open</code> in this folder (or <code>python3 live.py</code>, then reload).</div>';
  throw new Error("no live-data.js");
}
app.innerHTML = `
  <div class="controls world">
    <span class="wtitle">World</span>
    <label title="Grid side: n × n people">n <input id="wn" type="number" min="5" max="200" step="1"></label>
    <label title="Long-range friendships each person makes">q <input id="wq" type="number" min="0" max="12" step="1"></label>
    <label title="Starts the random draw of the whole world">seed <input id="wseed" type="number" min="0" step="1"></label>
    <label title="Up to 4 numbers of deciders; for each, the author whose k is nearest is shown">k <input id="wk" type="text" placeholder="9000, 3000, 2300"></label>
    <label title="Give each of these authors exactly this many deciders, instead of the nearest drawn one"><input id="wexact" type="checkbox"> exact k</label>
    <button id="wrun" class="primary">Run</button>
    <span class="status" id="wstatus"></span>
  </div>
  <div class="controls">
    <label title="Whose feed: the author's grid position and how many people want to follow them">Author <select id="author"></select></label>
    <label title="Which friend a decider points to, among friends who already have a pointer for this feed">Strategy <select id="strategy"></select></label>
    <label title="The contract, and with it the act that improves the paths">Contract <select id="then"><option value="ps">GFF-PS: shortening</option><option value="fr">GFF-FR: redundant following</option><option value="bc">GFF-FR-BC: redundant following + back-channel</option><option value="bcps">prototype: GFF-FR-BC + GFF-PS shortening</option><option value="bcpsg">prototype: GFF-FR-BC + GFF-PS, guarded</option></select></label>
    <label title="GFF-FR and GFF-FR-BC: how many pointers each follower keeps for the feed">d <select id="dsel"></select></label>
    <label title="GFF-PS: the probability that each introduction it needs is accepted">Introductions taken, p <select id="p"></select></label>
    <label title="The share of time each machine (all but the author's) is down">Machines down <select id="down"></select></label>
    <label title="A hop takes 1 + jitter × U(0, 1) time units">Jitter <select id="jitter"></select></label>
    <span>
      <button id="reset" title="Back to the start">&#x23EE;</button>
      <button id="back" title="One act back (left arrow)">&#x25C0;</button>
      <button id="play" class="primary" title="Play / pause (space)">Play</button>
      <button id="fwd" title="One act forward (right arrow)">&#x25B6;</button>
    </span>
    <label title="Playback only: acts per second; it does not change the outcome">Speed <input id="speed" type="range" min="0" max="100" value="50"> <span class="num" id="speedv"></span></label>
    <div class="scrub"><span class="phase" id="phase"></span><input id="pos" type="range" min="0" value="0"><span class="num" id="posv"></span></div>
  </div>
  <div class="layout">
    <div class="card stage">
      <canvas id="grid"></canvas>
      <div class="zoombar">
        <button id="zin" title="Zoom in (+). Also: mouse wheel, double-click, pinch">+</button>
        <button id="zout" title="Zoom out (−). Also: shift-double-click">−</button>
        <span class="num" id="zoomv">1×</span>
        <button id="zfit" title="Whole grid (0)">Fit</button>
        <button id="zauthor" title="Centre on the author (a)">Author</button>
      </div>
      <div class="tip" id="gtip"></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--ink)"></i>author</span>
        <span>path length <i class="ramp" id="rampsw"></i> <span class="num" id="rampv"></span></span>
        <span><i class="sw" style="border:1.5px solid var(--ink2)"></i>waiting decider</span>
        <span><i class="sw" style="background:var(--muted);width:5px;height:5px"></i>not yet decided</span>
        <span><i class="ln" style="border-color:var(--ink2)"></i>pointer to a friend</span>
        <span><i class="ln" style="border-color:var(--intro)"></i>pointer after introductions</span>
        <span><i class="sw" style="border:2px solid var(--critical)"></i>introduction refused</span>
        <span><i class="ln" style="border-color:var(--muted);border-top-style:dashed"></i>redundant pointer (GFF-FR)</span>
        <span><i class="sw" style="background:var(--axis);box-shadow:0 0 0 1.5px var(--ink2)"></i>machine down</span>
      </div>
    </div>
    <div class="card">
      <div class="tiles" id="tiles"></div>
      <h2>Mean path length of deciders who follow</h2>
      <div class="chartwrap"><svg id="chart"></svg><div class="tip" id="ctip"></div></div>
      <h2>Latest acts</h2>
      <ul id="log"></ul>
    </div>
  </div>
  <div class="card params">
    <h3>Chosen on this page</h3>
    <dl>
      <dt>Author</dt>
      <dd>Whose feed is shown, as the author's grid position (row, column) and <b>k</b>, how many people want to follow them (the deciders). It controls how dense the deciders are on the grid, k out of <span class="vN"></span> people, and that decides whether following spreads. A decider can only follow through a friend who already follows, so with few deciders the chains die out and most of them wait for ever; past a certain density they spread to nearly everyone.</dd>
      <dt>Strategy</dt>
      <dd>Which friend a decider points to, when several friends already have a pointer for this feed. The contract (GDO-L:1) leaves this open. <b>random</b>: any of them, uniformly. <b>first</b>: the first in the decider's friend list (grid neighbours before long-range friends). It controls the <i>length</i> of the paths the first following makes, not <i>who</i> follows. (The oracle <b>shortest</b> of <code>paths.py</code>'s tables isn't offered: no one's state holds path lengths.)</dd>
      <dt>Contract</dt>
      <dd>Every run has the first following (GDO-L:1) and delivery (GFF-I:2): each follower receives every item from whoever it points to, the first copy taken. Each contract adds one act that improves the paths, which no one chooses: the machines take it whenever it is enabled. <b>GFF-PS</b> (GFF-PS:1, shortening): a follower moves its pointer one step up its chain, to its target's target, which may need introductions; each follower is examined about <span class="vashort"></span> times per item period. The pointers stay a tree, each follower with one. <b>GFF-FR</b> (GFF-FR:1, redundant following): every follower keeps up to <b>d</b> pointers for the feed, adding them to friends who follow, so each item arrives along whichever of its paths is fastest and a failed friend doesn't cut it off. The clause excludes no one, so the author's friends add them too. <b>GFF-FR-BC</b> (GFF-FR-BC:1, the back-channel) adds to GFF-FR: a follower who gets an item first from one of its pointers forwards it to the others it points to, so a slow or broken branch catches up through its neighbour. No contract combines redundancy with shortening. Each pointer costs one copy of every item. <b>The two prototypes</b> (<code>combo_sim.py</code>, served only) do: GFF-FR-BC with GFF-PS:1's shortening, which moves one of a follower's pointers from Bob to one of Bob's own. Unguarded, it can close a loop of followers who point only at one another, drawn red; the guarded one shortens only to the one Bob received an item from, which leaves far fewer such loops, but not none.</dd>
      <dt>Time</dt>
      <dd>No phases and no rounds: every act happens at its own moment. Deciders decide at random times over the first <span class="vadecide"></span> time units, the author posts an item every <span class="vaperiod"></span>, and a run lasts <span class="vaend"></span> time units.</dd>
      <dt>d</dt>
      <dd>GFF-FR and GFF-FR-BC: the most pointers a follower keeps for the feed.</dd>
      <dt>Introductions taken, p</dt>
      <dd>GFF-PS: the probability that each introduction is accepted. To shorten, a follower Alice who points to Bob moves to Bob's own target Carol, but only if Alice and Carol know each other. Friends already do. Otherwise Bob must introduce Carol to Alice (Bob and Alice must agree) and Alice to Carol (Bob and Carol must agree). Each of these two is taken with probability p, independently, and once refused it's never asked again. It controls how much shortening happens: <b>p = 0</b>, only through friends; <b>p = 1</b>, everyone accepts, and every follower ends up pointing straight at the author.</dd>
      <dt>Machines down</dt>
      <dd>Each machine except the author's is down this share of the time, for random stretches of <span class="vadownmean"></span> item periods on average. A machine that is down takes nothing and sends nothing; when it comes back, it receives what it missed from everyone it points to and sends what they missed to everyone pointing to it. Drawn in grey.</dd>
      <dt>Jitter</dt>
      <dd>Each hop takes 1 + jitter × U(0, 1) time units, drawn afresh per copy. <b>0</b>: every hop takes the same time. Larger jitter spreads the times items take, which mostly matters to GFF-FR and GFF-FR-BC, whose copies race along several paths.</dd>
      <dt>Speed</dt>
      <dd>Acts played per second. Playback only; it doesn't change any result.</dd>
      <dt>Timeline (act)</dt>
      <dd>One act is one step of the run, in time order: the author posting an item; a decider following through a friend, or starting to wait; a follower shortening, or an introduction being refused (GFF-PS); a follower adding a redundant pointer (GFF-FR, GFF-FR-BC); a machine going down or coming back up. Deliveries aren't shown one by one. Drag it, click the chart, or step with the arrow keys.</dd>
      <dt>Zoom and pan</dt>
      <dd>Wheel or pinch to zoom at the pointer, drag to pan, double-click to zoom in (shift-double-click to zoom out), or the buttons on the grid: + − (keys + and −), Fit (0), Author (a). From about 20× each follower's path length is written under it.</dd>
    </dl>
    <h3 id="worldhead"></h3>
    <dl>
      <dt>n = <span class="vn"></span></dt>
      <dd>The grid side: <span class="vN"></span> people on an <span class="vn"></span>&times;<span class="vn"></span> grid. Each is friends with their grid neighbours (four, or fewer at an edge). It controls the size of the world: distances, and how many people a feed can reach.</dd>
      <dt>q = <span class="vq"></span></dt>
      <dd>Long-range friendships each person makes, to someone at grid distance d drawn with probability proportional to 1/d² (Kleinberg's small world). Friendship is mutual, so the mean number of friends here is <span class="vdeg"></span>. It controls the shortcuts: a larger q gives shorter graph distances and more friends per person, so following spreads with fewer deciders.</dd>
      <dt>seed = <span class="vseed"></span></dt>
      <dd>Starts the random draw of the friendships and each author's k and deciders, as in <code>tables/gff-ps-q<span class="vq"></span>.md</code> (with n = 100). The same n, q and seed give the same world. Each run (author, contract, strategy, p or d, jitter, machines down) then has a random draw of its own.</dd>
      <dt>k</dt>
      <dd>Every author's number of deciders is drawn from a power law, P(k) proportional to 1/k², so most authors are small and a few are huge; the deciders are then drawn uniformly from everyone else. The k you give are targets: for each, the author whose drawn k is nearest is offered in the Author menu, so k picks <i>which</i> authors you see without changing the world. Large k are rare, so the nearest one may be far off. <b>exact k</b> instead gives each of those authors exactly that many deciders, drawn afresh, so you can move k in small steps (say across the threshold where following starts to spread). Everything else stays the same, but that author is no longer the tables' draw.</dd>
      <dt>Strategies, p, jitter values</dt>
      <dd>Which of the above the menus offer (<code>live.py --strategies</code>, <code>--p</code>, <code>--jitter</code>). Opened without the server, the page has only the runs <code>live-data.js</code> holds (<code>--file-jitter</code>, <code>--file-down</code>).</dd>
    </dl>
    <h3>What the readouts mean</h3>
    <dl>
      <dt>Deciders following</dt>
      <dd>Deciders who have a pointer for this feed, so they receive it. The author's friends follow from the start, through their friend pointers. <b>Waiting</b>: decided, but no friend has a pointer yet.</dd>
      <dt>Path length</dt>
      <dd>How many hops a post takes from the author to a follower along the pointers (1 = directly from the author), the shortest along all its pointers. The colour of each dot. The tile and the chart show the mean over the deciders who follow, and the maximum. <b>Graph distance</b> (dashed line) is the mean shortest distance in the friendship graph for the same deciders. A path shorter than that is only possible through introductions. <b>Best tree</b> (long dashes) is the mean path in the shortest-path tree through the followers alone (the author, the author's friends and the deciders who follow): the best pointers between friends who follow can do.</dd>
      <dt>Pointing to the author</dt>
      <dd>How many people receive the feed straight from the author's own machine: the author's load. It starts at the author's friends, and grows as followers shorten onto the author.</dd>
      <dt>Shortenings</dt>
      <dd>GFF-PS: how many times a follower moved its pointer one step closer to the author. Also how many introductions were taken, and how many refused.</dd>
      <dt>Redundant pointers</dt>
      <dd>GFF-FR and GFF-FR-BC: how many pointers followers have added beyond their first.</dd>
      <dt>Pointer colours</dt>
      <dd>Grey: to a friend. Orange: to someone known only through introductions. Dashed grey: a redundant pointer. Rings: the latest acts (red: a refused introduction or a machine going down). A follower drawn red has no chain of pointers to the author; the contracts' acts keep everyone connected, so none should appear, except under the prototypes.</dd>
    </dl>
  </div>`;

const $ = id => document.getElementById(id);
let n = D.n, N = n * n;
const pos2 = x => `(${Math.floor(x / n)}, ${x % n})`;
const fmt = (x, d = 1) => (x == null || isNaN(x)) ? "–" : x.toFixed(d);

// ---------- the model's state, rebuilt by replaying events ----------
class State {
  constructor() { this.size = 0; this.tick = 0; }
  load(A) {
    if (this.size !== N) {
      this.size = N;
      this.parent = new Int32Array(N); this.waiting = new Uint8Array(N);
      this.intro = new Uint8Array(N); this.decider = new Uint8Array(N);
      this.depth = new Int32Array(N); this.extra = new Array(N); this.down = new Uint8Array(N);
      this.head = new Int32Array(N); this.nxt = new Int32Array(2 * N); this.src = new Int32Array(2 * N); this.queue = new Int32Array(N);
      this.bfs = -1;
    }
    this.A = A; this.decider.fill(0);
    for (const f of A.deciders) this.decider[f] = 1;
    this.reset();
  }
  reset() {
    const A = this.A;
    this.parent.fill(-1); this.waiting.fill(0); this.intro.fill(0);
    for (const f of A.friends) this.parent[f] = A.b;   // friend pointers
    this.pos = 0; this.shortens = 0; this.intros = 0; this.refusals = 0;
    this.items = 0; this.redundant = 0;
    this.extra.fill(null); this.down.fill(0);
    this.recent = []; this.flash = [];
  }
  apply(e, describe) {
    const t = e[0], a = e[1];
    let text = null, ring = t === "r" ? 1 : 0;
    if (t === "f") {
      this.parent[a] = e[2]; this.waiting[a] = 0; this.intro[a] = 0;
      if (describe) text = `${pos2(a)} ${e[3] ? "stops waiting and " : ""}follows through friend ${this.who(e[2])}`;
    } else if (t === "w") {
      this.waiting[a] = 1;
      if (describe) text = `${pos2(a)} decides to follow, but no friend has a pointer yet: waits`;
    } else if (t === "s") {
      const bob = e.length > 5 ? e[5] : this.parent[a];   // the prototypes name the pointer replaced
      const ex = this.extra[a], i = ex && bob !== this.parent[a] ? ex.indexOf(bob) : -1;
      if (i >= 0) { this.extra[a] = ex.slice(); this.extra[a][i] = e[2]; }
      else { this.parent[a] = e[2]; this.intro[a] = e[4] ? 0 : 1; }
      this.shortens++; this.intros += e[3];
      if (describe) text = `${pos2(a)} shortens: from ${this.who(bob)} to ${this.who(e[2])}` +
        (e[4] ? " (a friend)" : e[3] ? ` after ${e[3]} introduction${e[3] > 1 ? "s" : ""}` : " (already known)");
    } else if (t === "r") {
      this.refusals++; this.intros += e[3];
      if (describe) text = `introduction refused: ${pos2(a)} stays with ${this.who(this.parent[a])}, not ${this.who(e[2])}`;
    } else if (t === "i") {
      this.items = a;
      if (describe) text = `the author posts item ${a}`;
    } else if (t === "a") {
      (this.extra[a] = this.extra[a] || []).push(e[2]); this.redundant++;
      if (describe) text = `${pos2(a)} adds a redundant pointer to ${this.who(e[2])} (GFF-FR)`;
    } else if (t === "D") {
      this.down[a] = 1; ring = 1;
      if (describe) text = `${pos2(a)}'s machine goes down`;
    } else if (t === "U") {

    const tx = el("text", { x: cw - M.r, y: ys(g) - 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }); tx.textContent = "graph distance";
  }
  const bt = btMean(A);
  if (!isNaN(bt) && Math.abs(ys(bt) - ys(g)) > 12) {
    el("line", { x1: M.l, x2: cw - M.r, y1: ys(bt), y2: ys(bt), stroke: "var(--muted)", "stroke-dasharray": "6 3", "stroke-width": 1 });
    const tx = el("text", { x: cw - M.r, y: ys(bt) - 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }); tx.textContent = "best tree through followers";
  }
  const pts = series.filter(s => !isNaN(s[1])).map(s => `${xs(s[0]).toFixed(1)},${ys(s[1]).toFixed(1)}`);
  if (pts.length) el("polyline", { points: pts.join(" "), fill: "none", stroke: "var(--line)", "stroke-width": 2, "stroke-linejoin": "round" });
  const t0 = el("text", { x: M.l, y: ch - 4, fill: "var(--muted)", "font-size": 11 }); t0.textContent = "acts";
  cursorEl = el("line", { y1: M.t, y2: ch - M.b, stroke: "var(--ink)", "stroke-width": 1 });
  chartCursor();
}
function chartCursor() { if (cursorEl) { const x = xs(S.pos); cursorEl.setAttribute("x1", x); cursorEl.setAttribute("x2", x); } }
function chartAt(ev) {
  const r = svg.getBoundingClientRect();
  const t = Math.round((ev.clientX - r.left - M.l) / (cw - M.l - M.r) * timeline.length);
  return Math.max(0, Math.min(timeline.length, t));
}
svg.addEventListener("mousemove", ev => {
  const t = chartAt(ev); let best = series[0];
  for (const s of series) if (Math.abs(s[0] - t) < Math.abs(best[0] - t)) best = s;
  const tip = $("ctip"); tip.style.display = "block";
  tip.innerHTML = `act ${best[0].toLocaleString()}<br>mean path <b>${fmt(best[1])}</b>`;
  const r = svg.getBoundingClientRect();
  tip.style.left = Math.min(r.width - 150, Math.max(0, ev.clientX - r.left + 10)) + "px"; tip.style.top = "0px";
});
svg.addEventListener("mouseleave", () => $("ctip").style.display = "none");
svg.addEventListener("click", ev => { setPlaying(false); seek(chartAt(ev)); });

// ---------- hovering a person ----------
function hover(mx, my) {
  const U = unit(), j = Math.floor((mx - view.ox) / U), i = Math.floor((my - view.oy) / U);
  const tip = $("gtip");
  if (i < 0 || j < 0 || i >= n || j >= n) { tip.style.display = "none"; return; }
  const x = i * n + j, p = S.parent[x];
  S.tick++;
  const role = x === A.b ? "the author" : p >= 0 ? (S.decider[x] ? "decider, follows" : "friend of the author, follows")
    : S.waiting[x] ? "decider, waiting" : S.decider[x] ? "decider, not yet decided" : "not involved";
  let html = `<b>${pos2(x)}</b> ${role}${S.down[x] ? " · <b>machine down</b>" : ""}`;
  if (p >= 0) {
    const d = S.depthOf(x);
    html += `<br>${d < 0 ? "cut off: no pointer path to the author" : "path length " + d}<br>points to ${S.who(p)}${S.intro[x] ? " (introduced)" : " (a friend)"}`;
    if (S.extra[x]) html += `<br>also points to ${S.extra[x].map(y => S.who(y)).join(", ")}`;
  }
  tip.innerHTML = html; tip.style.display = "block";
  tip.style.left = Math.min(size - 170, mx + 26) + "px";
  tip.style.top = (my + 26) + "px";
}
cv.addEventListener("mouseleave", () => $("gtip").style.display = "none");

// ---------- playing ----------
function setPlaying(v) {
  playing = v && S.pos < timeline.length; $("play").textContent = playing ? "Pause" : "Play"; last = null;
}
let last = null;
function frame(now) {
  if (playing) {
    if (last != null) {
      acc += eps * Math.min(0.1, (now - last) / 1000);
      let k = Math.floor(acc); acc -= k;
      if (k > 0) {
        const end = Math.min(timeline.length, S.pos + k);
        while (S.pos < end) S.apply(timeline[S.pos], end - S.pos <= 40);
        if (S.pos >= timeline.length) setPlaying(false);
        render();
      }
    }
    last = now;
  }
  requestAnimationFrame(frame);
}
function speedLabel() { $("speedv").textContent = `${eps < 10 ? fmt(eps) : Math.round(eps).toLocaleString()} acts/s`; }
$("speed").addEventListener("input", () => { eps = Math.pow(10, $("speed").value / 100 * 4.7); speedLabel(); });
$("play").addEventListener("click", () => { if (!playing && S.pos >= timeline.length) seek(0); setPlaying(!playing); });
$("fwd").addEventListener("click", () => { setPlaying(false); seek(S.pos + 1); });
$("back").addEventListener("click", () => { setPlaying(false); seek(S.pos - 1); });
$("reset").addEventListener("click", () => { setPlaying(false); seek(0); });
$("pos").addEventListener("input", () => { setPlaying(false); seek(+$("pos").value); });
for (const id of ["author", "strategy", "p", "then", "jitter", "dsel", "down"]) $(id).addEventListener("change", () => { select(); speedLabel(); });
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "SELECT" || ev.target.tagName === "INPUT") return;
  if (ev.key === " ") { ev.preventDefault(); $("play").click(); }
  else if (ev.key === "ArrowRight") $("fwd").click();
  else if (ev.key === "ArrowLeft") $("back").click();
  else if (ev.key === "+" || ev.key === "=") $("zin").click();
  else if (ev.key === "-") $("zout").click();
  else if (ev.key === "0") fit();
  else if (ev.key === "a") $("zauthor").click();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTheme(); resize(); drawChart(); });
new ResizeObserver(() => { resize(); drawChart(); }).observe(cv);

readTheme();
useData(D);
const Q = new URLSearchParams(location.search);
if (Q.has("author")) $("author").value = Q.get("author");
if (Q.has("strategy")) $("strategy").value = Q.get("strategy");
if (Q.has("p")) $("p").value = String(+Q.get("p"));
if (Q.has("then") && Q.get("then") in CONTRACT) $("then").value = Q.get("then");
if (Q.has("d")) $("dsel").value = String(+Q.get("d"));
if (Q.has("down")) $("down").value = String(+Q.get("down"));
if (Q.has("jitter")) $("jitter").value = String(+Q.get("jitter"));
select(); speedLabel(); resize();
if (Q.has("t")) seek(+Q.get("t"));
if (Q.get("play") === "1") setPlaying(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
