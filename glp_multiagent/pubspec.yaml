name: glp_multiagent
description: GLP Multi-Window Multiagent Simulation

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  path: ^1.8.0
  path_provider: ^2.1.0

  # Link to existing GLP runtime
  glp_runtime:
    path: ../glp_runtime

  # GrassApp Duo: cross-phone madGLP routing over the Grassroots transport.
  grassroots_networking:
    path: ../networking
  redux: ^5.0.0
  cryptography: ^2.7.0
  sodium_libs: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # GLP sources, bundled for sandboxed platforms (iOS) where the engine cannot
  # read the repo from disk; on macOS the repo on disk is used instead.
  # tool/sync_glp_assets.sh generates both entries from the repository: every
  # .glp of the trees the app loads and the certified mini-apps' .glpw
  # artefacts, laid out flat under bundle/, and manifest.txt, which gives each
  # file its path in the tree the engine reads.  They are gitignored build
  # products, so run it before an iOS build.  Flutter bundles the files of a
  # directory named here and not those of its subdirectories, which is why the
  # tree is not named here directory by directory: that list drifted from the
  # tree (GLP, 2026-10-04 13:21 UTC).
  assets:
    - assets/glp/manifest.txt
    - assets/glp/bundle/
