name: glp_multiagent
description: GLP Multi-Window Multiagent Simulation

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  path: ^1.8.0
  path_provider: ^2.1.0

  # Link to existing GLP runtime
  glp_runtime:
    path: ../glp_runtime

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # GLP scenario sources, bundled for sandboxed platforms (iOS) where the engine
  # cannot read the repo from disk. Copied from programs/ — keep in sync via
  # tool/sync_glp_assets.sh. On macOS the repo on disk is used instead.
  assets:
    - assets/glp/programs/self.glp
    - assets/glp/programs/lib/routing/
    - assets/glp/programs/book/grassapp/
    - assets/glp/programs/social/graph/
    - assets/glp/programs/social/graph/ui/
    - assets/glp/programs/cssn/
    - assets/glp/programs/cssn/ui/
