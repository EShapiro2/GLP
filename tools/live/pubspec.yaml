name: glp_live_tests
description: >-
  The live test suite of the services installed on peoplesweb.org (GSA #2's
  task for GNA, 2026-11-08): two agents off the VPS, each a madGLP agent over
  its own headless layer, against the live rendezvous server (bin/live_rv.dart);
  run by tools/live/run_live.sh with the HTTP, DNS and mail checks.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  glp_runtime:
    path: ../../glp_runtime
  grassroots_networking_core:
    path: ../../networking/core
  grassroots_networking_glue:
    path: ../../networking/glue
  args: ^2.4.0
  cryptography: ^2.9.0
  sodium: ^3.4.6

dev_dependencies:
  test: ^1.25.0
