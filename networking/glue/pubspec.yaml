name: grassroots_networking_glue
description: >-
  GNA's backend glue: glp_runtime's network interface, GlpNetwork,
  implemented over the networking layer --- HeadlessGlpNetwork over the
  headless profile, GrassrootsGlpNetwork over the layer of the Flutter
  package.  A package of its own beside the core, depending on both the
  layer and the runtime, so that the core and its users (GPW's servers, the
  bootstrap anchor) carry no GLP runtime (GNA, 2026-10-11).
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # The runtime's network interface, GlpNetwork, which this package
  # implements; and the runtime itself, which the headless glue's
  # two-process test runs.
  glp_runtime:
    path: ../../glp_runtime

  # The layer: its pure-Dart core with the headless profile, and the Flutter
  # package with GrassrootsNetwork.
  grassroots_networking_core:
    path: ../core
  grassroots_networking:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  cryptography: ^2.9.0
  redux: ^5.0.0
  sodium: ^3.4.6
